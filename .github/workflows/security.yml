name: Static site security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate security policies and published assets
        run: python3 tools/check_security.py
